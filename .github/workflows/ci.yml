name: CI

# Fast feedback for feature branches and PRs. Pushes to main are covered by
# deploy.yml's own leading `test` job instead — running both here and there
# on every main push would just double the work for no benefit.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # packages/db's own test suite runs real queries against Postgres (no
    # fake-DB layer exists for that package) — a throwaway service container
    # here, not the real RDS instance (which has no route from outside its VPC).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry_test
          POSTGRES_PASSWORD: foundry_test
          POSTGRES_DB: foundry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://foundry_test:foundry_test@localhost:5432/foundry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx packages/db/src/migrate.ts
      - run: npm run test

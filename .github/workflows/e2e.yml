name: E2E

# Runs the Playwright/API suite against the live deployment: on a schedule
# (continuous monitoring, not just a one-time smoke test), on demand, and
# right after a successful deploy. Required repo configuration (Settings ->
# Secrets and variables -> Actions):
#   Secrets: E2E_CLERK_USER_EMAIL, E2E_CLERK_USER_PASSWORD (seeded Clerk
#            test user — see e2e/README.md), CLERK_SECRET_KEY,
#            SLACK_WEBHOOK_URL (optional — failure notifications only)
#   Variables: BASE_URL (the ALB DNS name), CLERK_PUBLISHABLE_KEY

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: [Deploy]
    types: [completed]

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      - name: Notify on failure
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Foundry E2E suite failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
        continue-on-error: true

name: E2E

# Runs the Playwright/API suite against the live deployment: on a schedule
# (continuous monitoring, not just a one-time smoke test), on demand, and
# right after a successful deploy. Required repo configuration (Settings ->
# Secrets and variables -> Actions):
#   Secrets: E2E_CLERK_USER_EMAIL, E2E_CLERK_USER_PASSWORD (seeded Clerk
#            test user — see e2e/README.md), CLERK_SECRET_KEY,
#            SLACK_WEBHOOK_URL (optional — failure notifications only)
#   Variables: BASE_URL (the ALB DNS name), CLERK_PUBLISHABLE_KEY,
#              E2E_CLERK_ORG_ID (the org the E2E user is a member of —
#              being a member isn't enough, Clerk sessions track an
#              *active* org separately, see tests/auth.setup.ts)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: [Deploy]
    types: [completed]

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check e2e credentials are configured
        id: creds
        env:
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: |
          if [ -z "$E2E_CLERK_USER_EMAIL" ] || [ -z "$E2E_CLERK_USER_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_CLERK_USER_EMAIL/E2E_CLERK_USER_PASSWORD aren't set yet — skipping the suite instead of failing noisily on every scheduled run. See e2e/README.md's one-time setup."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.creds.outputs.configured == 'true'
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
        if: steps.creds.outputs.configured == 'true'
      - working-directory: e2e
        run: npx playwright test
        if: steps.creds.outputs.configured == 'true'
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_CLERK_ORG_ID: ${{ vars.E2E_CLERK_ORG_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.configured == 'true'
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
      # playwright-report/ alone doesn't include the raw trace/screenshot/
      # video/error-context.md files Playwright's own failure output points
      # to (e.g. "test-results/auth.setup.ts-.../error-context.md") — only
      # test-results/ does. Every run has failed the same way since this
      # workflow started with nothing but a text stack trace to debug from;
      # upload this too so a failure is actually inspectable afterward.
      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.configured == 'true'
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Notify on failure
        if: failure() && steps.creds.outputs.configured == 'true' && vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Foundry E2E suite failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL"
        continue-on-error: true

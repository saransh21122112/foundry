name: Deploy

# Auto-deploys to production AWS on every push to main, gated on the `test`
# job passing first — matches how this app was actually deployed by hand
# all session (deploy, then verify live), just automated. `infra` only runs
# when infra/** changed, using a separate, more-privileged OIDC role than
# `deploy` — see infra/lib/foundry-stack.ts's GithubDeployRole/
# GithubCdkDeployRole for exactly what each role can do.
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   Secrets: AWS_DEPLOY_ROLE_ARN, AWS_CDK_DEPLOY_ROLE_ARN
#            (both are CfnOutputs from the CDK stack — GithubDeployRoleArn /
#            GithubCdkDeployRoleArn — after `cdk deploy` creates them)
#   Variables: AWS_REGION, ECS_CLUSTER_ARN, WEB_SERVICE_NAME,
#              AGENT_SERVICE_NAME, MIGRATE_SUBNET_IDS (comma-separated),
#              MIGRATE_SECURITY_GROUP_ID, CLERK_PUBLISHABLE_KEY
#              (not secret — it's baked into the client bundle at build time)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Same throwaway Postgres service as ci.yml — packages/db's test suite
    # runs real queries and has no fake-DB layer. Not the real RDS instance
    # (no route from outside its VPC).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry_test
          POSTGRES_PASSWORD: foundry_test
          POSTGRES_DB: foundry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://foundry_test:foundry_test@localhost:5432/foundry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx packages/db/src/migrate.ts
      - run: npm run test

  changes:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  # Three images built in parallel (separate matrix runners, not one
  # sequential shell script) with persistent GitHub Actions layer caching
  # (`type=gha`) — previously every single deploy re-ran `npm install`
  # from a completely empty Docker cache for all three images, which was
  # the dominant cost of a deploy. An unchanged package-lock.json now
  # means that layer (and everything before it) is a cache hit.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: foundry-web
            dockerfile: apps/web/Dockerfile
          - image: foundry-agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
          - image: foundry-db-migrate
            dockerfile: packages/db/Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:latest
          # Only apps/web/Dockerfile declares this ARG — an empty value
          # for the other two images is a harmless no-op, not an error.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ matrix.image == 'foundry-web' && vars.CLERK_PUBLISHABLE_KEY || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-app:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run DB migration (one-off Fargate task — RDS has no route from outside the VPC)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_ARN }}
          SUBNETS: ${{ vars.MIGRATE_SUBNET_IDS }}
          SG: ${{ vars.MIGRATE_SECURITY_GROUP_ID }}
        run: |
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition foundry-db-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task exited with code $EXIT_CODE"
            exit 1
          fi

      - name: Redeploy ECS services
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_ARN }}
          WEB_SERVICE: ${{ vars.WEB_SERVICE_NAME }}
          AGENT_SERVICE: ${{ vars.AGENT_SERVICE_NAME }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$WEB_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service "$AGENT_SERVICE" --force-new-deployment

          # `aws ecs wait services-stable` has a fixed ~10-minute budget with
          # no way to configure it via the plain CLI `wait` subcommand —
          # confirmed live (2026-08-10) it can report failure on a deploy
          # that actually succeeds seconds later. Poll the same
          # rolloutState the waiter itself reads, with a longer, real
          # timeout (20 min) that matches observed convergence time.
          for SERVICE in "$WEB_SERVICE" "$AGENT_SERVICE"; do
            echo "Waiting for $SERVICE to stabilize..."
            for i in $(seq 1 80); do
              STATE=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].deployments[0].rolloutState' --output text)
              if [ "$STATE" = "COMPLETED" ]; then
                echo "$SERVICE stable."
                break
              fi
              if [ "$STATE" = "FAILED" ]; then
                echo "$SERVICE deployment failed (rolloutState: FAILED)."
                exit 1
              fi
              if [ "$i" = "80" ]; then
                echo "$SERVICE did not stabilize within 20 minutes (last state: $STATE)."
                exit 1
              fi
              sleep 15
            done
          done

  deploy-infra:
    needs: [test, changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - working-directory: infra
        run: npx cdk deploy --require-approval never
